name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release asset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate
        run: npm run validate

      - name: Build artifact
        run: npm run package

      - name: Refuse mismatched tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./dist/manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $VERSION"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/manifest.json
