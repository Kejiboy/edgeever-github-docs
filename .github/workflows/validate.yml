name: Validate theme

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate token formats and contrast
        run: npm run validate

      - name: Build release artifact
        run: npm run package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: theme-dist
          path: dist/
          if-no-files-found: error
